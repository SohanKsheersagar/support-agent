[project]
name = "trailhaven-support-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1,<2",
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "sentence-transformers>=5.7,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
