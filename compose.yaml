services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trailhaven
      POSTGRES_DB: trailhaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailhaven -d trailhaven"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
